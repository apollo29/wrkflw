name: CI

on:
  push:
    branches: [main, v3]
    tags: ['v*']
  pull_request:
    branches: [main, v3]

jobs:
  backend:
    name: Backend (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.4', '8.5']
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, json, sodium
          coverage: none
          tools: composer:v2

      - name: Cache Composer-Pakete
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install
        run: composer install --no-interaction --prefer-dist

      - name: Code-Style
        run: composer cs

      - name: Statische Analyse
        run: composer stan

      - name: Tests (Unit + Integration)
        env:
          WF_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=workflow_test;charset=utf8mb4'
          WF_DB_USER: root
          WF_DB_PASS: root
        run: composer test

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    env:
      NG_CLI_ANALYTICS: 'false'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build Library
        run: npx ng build workflow-client

      - name: Build Demo
        run: npx ng build demo

      - name: Unit-Tests (Vitest)
        run: npm test

      - name: Playwright-Browser
        run: npx playwright install --with-deps chromium

      - name: End-to-End (Playwright)
        run: npx playwright test

      - name: Playwright-Bericht
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  e2e-echt:
    name: End-to-End (echtes Backend)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: workflow_demo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      NG_CLI_ANALYTICS: 'false'
      WF_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=workflow_demo;charset=utf8mb4'
      WF_DB_USER: root
      WF_DB_PASS: root
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, json, sodium
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Backend
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Install Frontend
        working-directory: frontend
        run: npm ci

      - name: Playwright-Browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Abnahme gegen Engine und MariaDB
        working-directory: frontend
        run: npx playwright test -c playwright.echt.config.ts

      - name: Playwright-Bericht
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-echt
          path: frontend/playwright-report-echt
          retention-days: 7
