name: Release

# Fuer Tags, die jemand VON HAND setzt. Der Normalfall laeuft ueber
# `auto-release.yml`: ein Merge nach main taggt und veroeffentlicht selbst.
# Beide lesen den CHANGELOG-Abschnitt mit demselben Skript.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Release-Notes aus CHANGELOG extrahieren
        run: |
          set -euo pipefail
          scripts/version.sh notes "${GITHUB_REF_NAME#v}" > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > release-notes.md
          fi

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
