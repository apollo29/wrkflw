openapi: 3.1.0
info:
  title: Workflow Engine API
  version: 1.0.0
  description: >
    REST-API der eingebetteten Workflow-Engine (Slim 4). Alle Antworten sind JSON.
    Fehler verwenden ein einheitliches Format ({ "error": { "code", "message" } }).
    Authentifizierung ist optional und austauschbar; die Default-Middleware erwartet
    einen API-Key als Bearer-Token (aktiv, wenn WF_API_KEY gesetzt ist).
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /workflows/{def}/instances:
    post:
      summary: Workflow starten
      operationId: startInstance
      parameters:
        - name: def
          in: path
          required: true
          description: ID der Workflow-Definition (neueste aktive Version wird genutzt).
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                context:
                  type: object
                  additionalProperties: true
                subjectType:
                  type: string
                subjectId:
                  type: string
      responses:
        '201':
          description: Instanz erstellt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceSummary'
        '400':
          description: Ungueltige Definition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Definition nicht gefunden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /instances/{id}:
    get:
      summary: Instanz-Zustand
      operationId: getInstance
      parameters:
        - $ref: '#/components/parameters/InstanceId'
      responses:
        '200':
          description: Zustand der Instanz
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { $ref: '#/components/schemas/Status' }
                  currentStep: { type: string }
                  context:
                    type: object
                    additionalProperties: true
                  lastError:
                    type: [string, 'null']
        '404':
          description: Instanz nicht gefunden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /instances/{id}/current-step:
    get:
      summary: Aktueller Schritt inkl. UI-Metadaten (fuer das Frontend)
      operationId: getCurrentStep
      parameters:
        - $ref: '#/components/parameters/InstanceId'
      responses:
        '200':
          description: Aktueller Schritt
          content:
            application/json:
              schema:
                type: object
                properties:
                  instanceId: { type: string }
                  status: { $ref: '#/components/schemas/Status' }
                  step: { type: string }
                  type:
                    type: string
                    enum: [automatic, interactive, timer]
                  interactive: { type: boolean }
                  finished: { type: boolean }
                  ui:
                    type: object
                    additionalProperties: true
                  events:
                    type: array
                    items: { type: string }
                  canGoBack:
                    type: boolean
                    description: >
                      Ob POST /instances/{id}/back von hier aus etwas bewirkt. Eine
                      Oberflaeche soll keinen Knopf zeigen, den die Engine
                      anschliessend mit 409 abweist.
                  context:
                    type: object
                    additionalProperties: true
        '404':
          description: Instanz nicht gefunden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /instances/{id}/events:
    post:
      summary: Event auf eine wartende Instanz anwenden
      operationId: postEvent
      parameters:
        - $ref: '#/components/parameters/InstanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event]
              properties:
                event: { type: string }
                payload:
                  type: object
                  additionalProperties: true
                  description: >
                    Wird beim Verarbeiten gefiltert (ADR 0006). Schluessel mit dem
                    Prefix "__" gehoeren der Engine und werden immer verworfen; je
                    nach konfigurierter EventPayloadPolicy zusaetzlich alles, was der
                    aktuelle Schritt nicht in ui.fields deklariert. Verworfene
                    Schluessel fuehren NICHT zu einem Fehler - die Antwort bleibt 200,
                    und sie stehen in der History unter event_payload_rejected. Das
                    Schema bleibt deshalb bewusst offen: der Server verwirft, er lehnt
                    nicht ab.
      responses:
        '200':
          description: Event verarbeitet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceSummary'
        '404':
          description: Instanz nicht gefunden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Workflow bereits beendet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Pflichtfeld "event" fehlt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /instances/{id}/back:
    post:
      summary: Einen Schritt zurueck
      operationId: goBack
      description: >
        Setzt die Instanz auf den letzten interaktiven Schritt zurueck, den sie
        tatsaechlich durchlaufen hat (aus der History, nicht aus dem Graphen);
        automatische Schritte dazwischen werden uebersprungen, damit ihre Aktion
        nicht ein zweites Mal laeuft. Freigegeben wird das je Schritt ueber
        ui.back = true.


        Ist im eigenen Ablauf kein solcher Schritt mehr da, aber ein
        Eltern-Ablauf wartet auf diesen hier, geht es ueber die Ablauf-Grenze
        hinweg weiter zurueck: diese Instanz wird cancelled, und die Antwort
        berichtet ueber den Eltern-Ablauf.


        Kein Rumpf - wohin es zurueckgeht, weiss die Engine, nicht der Aufrufer.
      parameters:
        - $ref: '#/components/parameters/InstanceId'
      responses:
        '200':
          description: Zurueckgesetzt; berichtet wird die Instanz, die jetzt am Zug ist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceSummary'
        '404':
          description: Instanz nicht gefunden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Von diesem Schritt aus gibt es kein Zurueck
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /instances/{id}/history:
    get:
      summary: History-Eintraege einer Instanz
      operationId: getHistory
      parameters:
        - $ref: '#/components/parameters/InstanceId'
      responses:
        '200':
          description: Chronologische History
          content:
            application/json:
              schema:
                type: object
                properties:
                  instanceId: { type: string }
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string }
                        step: { type: [string, 'null'] }
                        detail:
                          type: object
                          additionalProperties: true
                        createdAt: { type: string }
        '404':
          description: Instanz nicht gefunden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    InstanceId:
      name: id
      in: path
      required: true
      description: UUID der Instanz.
      schema:
        type: string
  schemas:
    Status:
      type: string
      enum: [running, waiting_event, waiting_timer, completed, failed, cancelled]
      description: >
        cancelled = jemand ist aus diesem Ablauf herausgegangen, bevor er zu Ende
        war (siehe POST /instances/{id}/back). Endzustand wie completed/failed.
    InstanceSummary:
      type: object
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/Status' }
        currentStep: { type: string }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
